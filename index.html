<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャーハンのおにぎり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper: #FAF6EC;
  --cream: #FFFDF6;
  --ink:   #2A2519;
  --ink2:  #5E594D;
  --mut:   #A79E8B;
  --hair:  #E8E1CE;
  --red:   #E60012;
  --amber: #E8A33D;
  --green: #3E9B4F;
  --blue:  #2E7FC2;
  --pink:  #E85D8A;
  --maru:  'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
  --sans:  'Noto Sans JP', sans-serif;
  --mono:  'IBM Plex Mono', monospace;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.85;
  letter-spacing: .03em;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 780px; margin: 0 auto; padding: 0 1.3rem; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,246,236,.88);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hair);
  margin: 0 -1.3rem; padding: .55rem 1.3rem;
  display: flex; align-items: center; gap: .7rem;
}
.topbar .mini-logo { width: 36px; height: 36px; flex-shrink: 0; cursor: pointer; }
.topbar .mini-logo svg { width: 100%; height: 100%; display: block; }
.topbar .wordmark { font-family: var(--maru); font-weight: 900; font-size: .95rem; letter-spacing: .03em; white-space: nowrap; }
.topbar nav { margin-left: auto; }

/* ── NAV ── */
nav { display: flex; align-items: baseline; gap: 1.3rem; flex-wrap: wrap; }
nav a {
  font-family: var(--maru); font-size: .8rem; font-weight: 700; letter-spacing: .06em;
  color: var(--mut); text-decoration: none; position: relative; padding-bottom: 2px;
  transition: color .2s;
}
nav a:hover { color: var(--ink); }
nav a.active { color: var(--ink); }
nav a.active::after {
  content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--red);
}
nav a .tip {
  position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: .5rem; letter-spacing: .2em; color: var(--mut);
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s;
}
nav a:hover .tip, nav a.tooltip-show .tip { opacity: 1; }
.nav-count { font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; color: var(--mut); }

/* ── HERO ── */
.hero { padding: 7.5vh 0 3.2rem; text-align: center; }
.hero-logo { display: flex; justify-content: center; }
.hero-logo .logo-box { width: min(196px, 48vw); cursor: pointer; }
.hero-logo svg { width: 100%; height: auto; display: block; }
.logo-in { animation: logoIn 1.15s cubic-bezier(.2,1.35,.3,1) both; }
@keyframes logoIn {
  from { transform: rotate(-260deg) scale(.4); opacity: 0; }
  to   { transform: rotate(0deg)   scale(1); opacity: 1; }
}
.spin-once { animation: spinOnce .65s cubic-bezier(.3,.7,.4,1) both; }
@keyframes spinOnce { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.logo-svg path { animation: cellFade .8s ease both; }
@keyframes cellFade { from { opacity: 0; } to { opacity: 1; } }
.hero-title {
  font-family: var(--maru); font-weight: 900;
  font-size: clamp(2rem, 7.4vw, 3.1rem);
  line-height: 1.3; letter-spacing: .04em; margin-top: 1.5rem;
}
.hero-latin {
  font-family: var(--mono); font-weight: 500; font-size: .62rem;
  letter-spacing: .36em; color: var(--mut); display: block; margin-top: .8rem;
}
.hero-sub { margin: 1.6rem auto 0; font-size: .9rem; color: var(--ink2); line-height: 2.05; max-width: 32em; }
.hero-chips { margin-top: 1.7rem; display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
.hero-chips span {
  font-family: var(--maru); font-weight: 700; font-size: .68rem; letter-spacing: .08em;
  background: var(--cream); border: 1px solid var(--hair); border-radius: 999px; padding: .32em 1em; color: var(--ink2);
}
.hero-chips span .dot { color: var(--red); }

/* ── SECTION HEADER ── */
.sec-head { display: flex; align-items: center; gap: .8rem; margin: 2.6rem 0 1.3rem; }
.sec-head .bar { width: 6px; height: 26px; border-radius: 3px; background: var(--red); }
.sec-head h2 { font-family: var(--maru); font-weight: 900; font-size: 1.3rem; letter-spacing: .05em; }
.sec-head .en { font-family: var(--mono); font-size: .58rem; letter-spacing: .24em; color: var(--mut); }
.sec-head .line { flex: 1; border-top: 1px solid var(--hair); }

/* ── ENTRY CARDS ── */
.entries { display: flex; flex-direction: column; gap: 1.4rem; }
.entry {
  background: var(--cream); border: 1px solid var(--hair); border-radius: 18px;
  overflow: hidden;
  opacity: 0; transform: translateY(16px);
  transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
}
.entry.in { opacity: 1; transform: none; }
.entry.in:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(42,37,25,.09); }
.card-body { padding: 1.3rem 1.5rem 1.4rem; }
.meta-row { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; margin-bottom: .75rem; }
.chip {
  font-family: var(--maru); font-weight: 700; font-size: .62rem; letter-spacing: .14em;
  color: #fff; border-radius: 999px; padding: .28em .95em; line-height: 1.5;
}
.chip.diary { background: var(--red); }
.chip.kana  { background: var(--amber); }
.chip.essay { background: var(--blue); }
.meta-date { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; color: var(--mut); }
.meta-new { font-family: var(--mono); font-size: .6rem; font-weight: 600; letter-spacing: .18em; color: var(--red); }
.meta-no { margin-left: auto; font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; color: var(--mut); }
.entry h3 {
  font-family: var(--maru); font-weight: 900; font-size: 1.32rem; line-height: 1.45; letter-spacing: .02em;
  margin-bottom: .5rem;
}
.entry h3 a { color: var(--ink); text-decoration: none; transition: color .2s; }
.entry h3 a:hover { color: var(--red); }
.entry p.excerpt {
  font-size: .88rem; color: var(--ink2); line-height: 1.95;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.entry-essay p.excerpt { -webkit-line-clamp: 2; }
.read-more {
  display: inline-flex; align-items: center; gap: .4em; margin-top: .9rem;
  font-family: var(--maru); font-weight: 700; font-size: .74rem; letter-spacing: .1em;
  color: var(--ink); text-decoration: none;
}
.read-more .arr { transition: transform .25s ease; color: var(--red); }
.read-more:hover .arr { transform: translateX(4px); }

/* diary photo */
.diary-photo img {
  width: 100%; aspect-ratio: 16/8.2; object-fit: cover; object-position: center; display: block;
  transition: transform .8s cubic-bezier(.22,1,.36,1);
}
.entry-diary:hover .diary-photo img { transform: scale(1.025); }
.diary-photo { overflow: hidden; }
.diary-img-placeholder {
  width: 100%; aspect-ratio: 16/8.2; background: #F1EAD8;
  display: flex; align-items: center; justify-content: center;
}
.diary-img-placeholder span { font-family: var(--mono); font-size: .58rem; letter-spacing: .26em; color: var(--mut); }

/* kana card（ステンドグラスの淡色） */
.entry-kana.tint-0 { background: #FDF6E0; border-color: #EFDFB2; }
.entry-kana.tint-1 { background: #EDF6FD; border-color: #C9E2F2; }
.entry-kana.tint-2 { background: #FDEEF2; border-color: #F3CDD8; }
.entry-kana.tint-3 { background: #EFF7EC; border-color: #CBE3C4; }
.kana-text {
  font-family: var(--maru); font-weight: 500;
  font-size: clamp(1.06rem, 2.8vw, 1.26rem);
  line-height: 2.25; letter-spacing: .05em; padding: .2rem 0 .4rem;
}
.kana-byline {
  margin-top: .8rem; display: flex; align-items: center; gap: .6rem;
  font-family: var(--mono); font-size: .56rem; letter-spacing: .18em; color: var(--mut);
}
.kana-byline .rk {
  font-family: var(--maru); font-weight: 700; font-size: .68rem; letter-spacing: .1em;
  background: var(--cream); border: 1px solid var(--hair); border-radius: 999px; padding: .2em .9em; color: var(--ink2);
}

/* essay number */
.entry-essay { position: relative; }
.essay-bg-num {
  position: absolute; top: .4rem; right: 1.1rem;
  font-family: var(--maru); font-weight: 900; font-size: 3.4rem; line-height: 1;
  color: #F0E9D6; pointer-events: none; user-select: none;
}

/* ── ABOUT ── */
.about {
  margin: 3rem 0 0; background: #FDF6E0; border: 1px solid #EFDFB2; border-radius: 18px;
  padding: 1.5rem 1.6rem; display: flex; gap: 1.3rem; align-items: center;
}
.about .mini-logo { width: 74px; height: 74px; flex-shrink: 0; cursor: pointer; }
.about .mini-logo svg { width: 100%; height: 100%; display: block; }
.about h2 { font-family: var(--maru); font-weight: 900; font-size: 1.05rem; margin-bottom: .4rem; letter-spacing: .04em; }
.about-text { font-size: .88rem; color: var(--ink2); line-height: 2; }

/* ── FOOTER ── */
footer { margin-top: 3.4rem; border-top: 1px solid var(--hair); padding: 2.2rem 0 3rem; text-align: center; }
footer .mini-logo { width: 64px; height: 64px; margin: 0 auto; cursor: pointer; }
footer .mini-logo svg { width: 100%; height: 100%; display: block; }
.foot-mark { font-family: var(--maru); font-weight: 900; font-size: 1rem; margin-top: .9rem; letter-spacing: .04em; }
.f-left { font-family: var(--mono); font-size: .58rem; letter-spacing: .16em; color: var(--mut); line-height: 2.1; margin-top: .5rem; }
.footer-asterisk { color: var(--red); display: inline-block; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(42,37,25,.5);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  z-index: 10000; display: flex; align-items: flex-start; justify-content: center;
  padding: 3.5vh 1rem; overflow-y: auto;
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--cream); width: 100%; max-width: 660px; border-radius: 20px;
  padding: 2.6rem 2.4rem 2.8rem; position: relative; margin: auto;
  transform: translateY(18px); transition: transform .35s cubic-bezier(.22,1,.36,1);
  box-shadow: 0 30px 60px rgba(42,37,25,.22);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-close {
  position: absolute; top: 1rem; right: 1rem;
  background: var(--ink); color: var(--cream); border: none; border-radius: 999px;
  font-family: var(--maru); font-weight: 700; font-size: .7rem; letter-spacing: .08em;
  cursor: pointer; padding: .5em 1.2em; transition: background .2s;
}
.modal-close:hover { background: var(--red); }
.modal-meta { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin-bottom: .9rem; }
.modal-title {
  font-family: var(--maru); font-weight: 900; font-size: 1.55rem; line-height: 1.5; letter-spacing: .02em;
  margin-bottom: 1.7rem;
}
.modal-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 1.8rem; }
.modal-body { font-size: .95rem; line-height: 2.05; letter-spacing: .03em; color: #3B372C; }
.modal-body p { margin-bottom: 1em; }
.modal-body strong { font-weight: 700; color: var(--ink); box-shadow: inset 0 -0.5em 0 #FFE9A8; padding: 0 .06em; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .wrap { padding: 0 1rem; }
  .topbar { margin: 0 -1rem; padding: .55rem 1rem; }
  .topbar .wordmark { display: none; }
  nav { gap: 1rem; }
  .card-body { padding: 1.15rem 1.15rem 1.25rem; }
  .about { flex-direction: column; text-align: center; }
  .modal { padding: 2.2rem 1.25rem 2.4rem; border-radius: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .logo-in, .spin-once, .logo-svg path, .footer-asterisk { animation: none; }
  .entry { transition: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="wrap">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="mini-logo js-logo" title="模様が変わる"></div>
    <span class="wordmark">チャーハンのおにぎり</span>
    <nav>
      <a href="#" class="active" data-category="all">すべて<span class="tip">ALL</span></a>
      <a href="#" data-category="diary">日記<span class="tip">DIARY</span></a>
      <a href="#" data-category="kana">ことば<span class="tip">KOTOBA</span></a>
      <a href="#" data-category="essay">文章<span class="tip">ESSAY</span></a>
      <span class="nav-count js-count">— entries</span>
    </nav>
  </div>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-logo">
      <div class="logo-box logo-in js-logo" id="hero-logo" title="クリックで模様が変わる"></div>
    </div>
    <h1 class="hero-title">チャーハンのおにぎり</h1>
    <span class="hero-latin">CHAAHAN NO ONIGIRI</span>
    <p class="hero-sub">日記と、ことばの断片と、ときどき文章。街で見たもの、食べたもの、ふと思ったことの置き場です。</p>
    <div class="hero-chips">
      <span><span class="dot">●</span> 東京</span>
      <span>不定期更新</span>
    </div>
  </header>

  <!-- ENTRIES -->
  <main>
    <div class="sec-head">
      <span class="bar"></span>
      <h2>新着記事</h2>
      <span class="en">LATEST</span>
      <span class="line"></span>
    </div>
    <div class="entries" id="entries">
      <!-- posts.json から動的に生成されます -->
    </div>

    <section class="about">
      <div class="mini-logo js-logo" title="模様が変わる"></div>
      <div>
        <h2>このブログについて</h2>
        <!-- ▼▼▼ プロフィール（仮） ▼▼▼ -->

          東京で暮らしながら、日記とことばの断片を置いていく場所。サンプルテキストが入っています。
        </p>

      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="mini-logo js-logo" title="模様が変わる"></div>
    <div class="foot-mark">チャーハンのおにぎり</div>
    <div class="f-left">
      © 2026 shunta — written in tokyo <span class="footer-asterisk" aria-hidden="true">✦</span>
    </div>
  </footer>

</div><!-- /wrap -->

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">とじる ×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ── ランダムひらがな生成 ──
const hiragana = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を'];

function randomKana() {
  const len = Math.random() < 0.5 ? 2 : 3;
  return Array.from({length: len}, () => hiragana[Math.floor(Math.random() * hiragana.length)]).join('');
}

// ── 本文レンダリング ──
function parseInline(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,     '<em>$1</em>');
}

// 一覧用（省略あり）
function renderBody(body) {
  if (Array.isArray(body)) {
    return body.map(line => {
      if (line === '') return '<br>';
      if (line.startsWith('> ')) return `<span style="border-left:3px solid var(--red);padding-left:.5em;color:var(--ink2)">${parseInline(line.slice(2))}</span>`;
      return parseInline(line);
    }).join('<br>');
  }
  return parseInline(body);
}

// モーダル用（全文・段落区切り）
function renderBodyFull(body) {
  if (Array.isArray(body)) {
    return body.map(line => {
      if (line === '') return '<p style="margin-bottom:.5em">&nbsp;</p>';
      if (line.startsWith('> ')) return `<blockquote style="border-left:3px solid var(--red);padding-left:.9rem;color:var(--ink2);margin:.6em 0;font-size:.92rem">${parseInline(line.slice(2))}</blockquote>`;
      return `<p>${parseInline(line)}</p>`;
    }).join('');
  }
  return `<p>${parseInline(body)}</p>`;
}

// ── エントリーHTML生成 ──
function renderDiary(post, index, no) {
  const photoHtml = post.photo
    ? `<div class="diary-photo"><img src="${post.photo}" alt="${post.title}"></div>`
    : `<div class="diary-img-placeholder"><span>NO PHOTO</span></div>`;
  return `
    <article class="entry entry-diary" data-category="diary">
      ${photoHtml}
      <div class="card-body">
        <div class="meta-row">
          <span class="chip diary">日記</span>
          <span class="meta-date">${post.date}</span>
          ${index === 0 ? '<span class="meta-new">NEW</span>' : ''}
          <span class="meta-no">No.${String(no).padStart(2, '0')}</span>
        </div>
        <h3><a href="#" class="open-modal" data-index="${index}">${post.title}</a></h3>
        <p class="excerpt">${renderBody(post.body)}</p>
        <a href="#" class="read-more open-modal" data-index="${index}">つづきを読む <span class="arr">→</span></a>
      </div>
    </article>`;
}

function renderKana(post, index, no) {
  const linesHtml = post.lines.join('<br>');
  return `
    <article class="entry entry-kana tint-${index % 4}" data-category="kana">
      <div class="card-body">
        <div class="meta-row">
          <span class="chip kana">ことば</span>
          <span class="meta-date">${post.date}</span>
          ${index === 0 ? '<span class="meta-new">NEW</span>' : ''}
          <span class="meta-no">No.${String(no).padStart(2, '0')}</span>
        </div>
        <div class="kana-text">${linesHtml}</div>
        <div class="kana-byline"><span class="rk">${randomKana()}</span><span>ことばの断片</span></div>
      </div>
    </article>`;
}

function renderEssay(post, num, index, no) {
  return `
    <article class="entry entry-essay" data-category="essay">
      <span class="essay-bg-num">${String(num).padStart(2, '0')}</span>
      <div class="card-body">
        <div class="meta-row">
          <span class="chip essay">文章</span>
          <span class="meta-date">${post.date}</span>
          ${index === 0 ? '<span class="meta-new">NEW</span>' : ''}
          <span class="meta-no">No.${String(no).padStart(2, '0')}</span>
        </div>
        <h3><a href="#" class="open-modal" data-index="${index}">${post.title}</a></h3>
        <p class="excerpt">${renderBody(post.body)}</p>
        <a href="#" class="read-more open-modal" data-index="${index}">つづきを読む <span class="arr">→</span></a>
      </div>
    </article>`;
}

// ── ロゴ（開くたびにランダムなステンドグラス） ──
const LOGO_INK = '#1D1A14';
const PANE_COLORS = ['#F2C14E', '#E60012', '#3E9B4F', '#7BD3FF', '#F0742E', '#E85D8A'];
const lf = n => Math.round(n * 10) / 10;
let logoUID = 0;

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function scatterPts(rng, cx, cy, R, count, minDist) {
  const pts = [];
  let guard = 0;
  while (pts.length < count && guard++ < 800) {
    const a = rng() * Math.PI * 2;
    const r = Math.sqrt(rng()) * (R - 4);
    const p = [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    if (pts.every(q => (q[0]-p[0])**2 + (q[1]-p[1])**2 > minDist * minDist)) pts.push(p);
  }
  return pts;
}

function clipBisector(poly, p, q) {
  const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
  const dx = q[0] - p[0], dy = q[1] - p[1];
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = (a[0] - mx) * dx + (a[1] - my) * dy;
    const db = (b[0] - mx) * dx + (b[1] - my) * dy;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
      const t = da / (da - db);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}

function randomGlass(seed) {
  const rng = mulberry32(seed);
  const cx = 100, cy = 100, R = 61;
  const seeds = scatterPts(rng, cx, cy, R, 13, 17);
  const circle = [];
  for (let i = 0; i < 64; i++) {
    const a = i / 64 * Math.PI * 2;
    circle.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  let cells = '';
  seeds.forEach((p, idx) => {
    let poly = circle;
    seeds.forEach((q, j) => { if (j !== idx) poly = clipBisector(poly, p, q); });
    if (poly.length < 3) return;
    const d = poly.map((v, i) => `${i === 0 ? 'M' : 'L'}${lf(v[0])} ${lf(v[1])}`).join(' ') + ' Z';
    const fillIt = rng() < 0.38;
    const fill = fillIt ? PANE_COLORS[Math.floor(rng() * PANE_COLORS.length)] : 'none';
    cells += `<path d="${d}" fill="${fill}" ${fillIt ? 'fill-opacity="0.20"' : ''} style="animation-delay:${Math.min(idx * 45, 600)}ms"/>`;
  });
  return `<g stroke="${LOGO_INK}" stroke-width="1" opacity="0.6">${cells}</g>`;
}

function badgeSVG(seed) {
  logoUID++;

    <g clip-path="url(#logo-clip-${logoUID})">

}

// すべてのロゴ置き場にランダム柄で描く（クリックで回って模様替え）
document.querySelectorAll('.js-logo').forEach(el => {
  const draw = () => { el.innerHTML = badgeSVG(Math.floor(Math.random() * 1e9)); };
  draw();
  el.addEventListener('click', () => {
    el.classList.remove('spin-once');
    void el.offsetWidth;
    el.classList.add('spin-once');
    setTimeout(draw, 300);
  });
});

// ── モーダル ──
const overlay     = document.getElementById('modal-overlay');
const modalContent = document.getElementById('modal-content');
const modalClose  = document.getElementById('modal-close');
let allPosts = [];

function openModal(post) {
  let html = '';
  if (post.type === 'diary' && post.photo) {
    html += `<img class="modal-photo" src="${post.photo}" alt="${post.title}">`;
  }
  const chipClass = post.type === 'diary' ? 'diary' : post.type === 'essay' ? 'essay' : 'kana';
  const chipLabel = post.type === 'diary' ? '日記' : post.type === 'essay' ? '文章' : 'ことば';
  html += `
    <div class="modal-meta">
      <span class="chip ${chipClass}">${chipLabel}</span>
      <span class="meta-date">${post.date}</span>
    </div>
    <h2 class="modal-title">${post.title || post.lines?.join('　') || ''}</h2>
    <div class="modal-body">${post.body ? renderBodyFull(post.body) : post.lines?.join('<br>') || ''}</div>
  `;
  modalContent.innerHTML = html;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── スクロールでふわりと出す ──
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.06 }) : null;

// ── メイン：posts.json を読み込んでレンダリング ──
const container = document.getElementById('entries');
const navLinks  = document.querySelectorAll('nav a');
const countEl   = document.querySelector('.js-count');

fetch('posts.json')
  .then(r => r.json())
  .then(posts => {
    allPosts = posts;
    let essayCount = 0;
    let html = '';
    posts.forEach((post, i) => {
      const no = posts.length - i;
      if (post.type === 'diary')  html += renderDiary(post, i, no);
      if (post.type === 'kana')   html += renderKana(post, i, no);
      if (post.type === 'essay')  html += renderEssay(post, ++essayCount, i, no);
    });
    container.innerHTML = html;
    countEl.textContent = posts.length + ' entries';

    container.querySelectorAll('.entry').forEach(el => {
      if (io) io.observe(el); else el.classList.add('in');
    });

    // モーダルを開くリンクにイベント設定
    container.querySelectorAll('.open-modal').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const index = parseInt(link.dataset.index);
        openModal(allPosts[index]);
      });
    });

    setupFilter();
  })
  .catch(() => {
    container.innerHTML = '<p style="padding:2rem;color:var(--mut);font-size:.85rem;">記事を読み込めませんでした。posts.json が同じフォルダにあるか確認してください。</p>';
  });

// ── カテゴリフィルタ ──
function setupFilter() {
  navLinks.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const cat = link.dataset.category;
      navLinks.forEach(l => l.classList.remove('active'));
      link.classList.add('active');

      const entries = container.querySelectorAll('.entry');
      let visible = 0;

      entries.forEach(entry => {
        const match = cat === 'all' || entry.dataset.category === cat;
        entry.style.display = match ? '' : 'none';
        if (match) { visible++; entry.classList.add('in'); }
      });
      countEl.textContent = visible + ' entries';
    });
  });
}

// ── navラベルをランダムひらがなに ──
navLinks.forEach((el, i) => {
  const tip = el.querySelector('.tip');
  const tipText = tip ? tip.outerHTML : '';
  el.innerHTML = (i === 0 ? '全' + randomKana() : randomKana()) + tipText;
});

// ── スマホタップ時にツールチップを一瞬表示 ──
navLinks.forEach(link => {
  link.addEventListener('touchstart', () => {
    link.classList.add('tooltip-show');
    setTimeout(() => link.classList.remove('tooltip-show'), 1200);
  }, { passive: true });
});
</script>
